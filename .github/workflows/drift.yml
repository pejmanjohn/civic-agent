name: Source drift (manual fallback)

# Local-first ops: the daily drift check runs on the maintainer's machine via
# launchd (scripts/drift-notify.sh; see CONTRIBUTING.md Local Ops). This
# workflow is kept as a manual fallback only - no scheduled GH compute.
on:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live drift checks against official sources
        run: python3 scripts/drift.py
        # A red run means an official source moved (refresh the snapshot and
        # card fingerprint) or an endpoint broke. Both deserve eyes; neither
        # is ignorable. See scripts/drift.py for per-source semantics.
